<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali - Department of CSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #1a0e2e 50%, #2d1810 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            cursor: pointer;
        }

        /* Firecracker Launch Screen */
        .launch-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #001122 0%, #000511 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 1s ease, transform 1s ease;
        }

        .launch-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .firecracker-container {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .firecracker-container:hover {
            transform: scale(1.1);
        }

        .firecracker {
            width: 80px;
            height: 200px;
            position: relative;
            animation: sway 2s ease-in-out infinite;
        }

        .firecracker-body {
            width: 60px;
            height: 160px;
            background: linear-gradient(45deg, #DC143C 0%, #B22222 50%, #8B0000 100%);
            border-radius: 8px;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .firecracker-body::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: #FFD700;
            border-radius: 2px;
        }

        .firecracker-body::after {
            content: '';
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: #FFD700;
            border-radius: 2px;
        }

        .firecracker-fuse {
            width: 4px;
            height: 40px;
            background: linear-gradient(to bottom, #8B4513, #654321);
            border-radius: 2px;
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
        }

        .fuse-spark {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #FFD700, #FF4500);
            border-radius: 50%;
            animation: sparkle-fuse 0.5s ease-in-out infinite alternate;
            opacity: 0;
        }

        .fuse-spark.active {
            opacity: 1;
            animation: burn-down 3s linear forwards;
        }

        .instruction-text {
            color: #FFD700;
            font-size: 1.5rem;
            text-align: center;
            margin-top: 50px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            animation: pulse-text 2s ease-in-out infinite;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        @keyframes sparkle-fuse {
            0% { 
                transform: translateX(-50%) scale(1); 
                box-shadow: 0 0 5px #FFD700;
            }
            100% { 
                transform: translateX(-50%) scale(1.5); 
                box-shadow: 0 0 15px #FF4500;
            }
        }

        @keyframes burn-down {
            0% { top: -10px; opacity: 1; }
            90% { top: 30px; opacity: 1; }
            100% { top: 35px; opacity: 0; }
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Explosion Effect */
        .explosion-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #FFD700 0%, #FF4500 20%, #DC143C 40%, #8B0000 60%, #000 100%);
            z-index: 1500;
            opacity: 0;
            display: none;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .explosion-screen.active {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
            animation: explosion-flash 2s ease-out forwards;
        }

        @keyframes explosion-flash {
            0% {
                opacity: 1;
                transform: scale(0.1);
            }
            20% {
                opacity: 1;
                transform: scale(2);
            }
            100% {
                opacity: 0;
                transform: scale(5);
            }
        }

        /* ===== GREETING CARD STYLES ===== */
        .greeting-card {
            width: 90vw;
            max-width: 900px;
            height: 70vh;
            max-height: 600px;
            min-height: 500px;
            background: linear-gradient(45deg, #8B0000 0%, #1a237e 50%, #b8860b 100%);
            border-radius: 25px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
            opacity: 1;
            transition: opacity 1s ease, transform 1s ease;
            z-index: 100;
        }

        .greeting-card.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            z-index: 1001;
        }

        .greeting-card.hidden {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            z-index: 100;
        }

        .greeting-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="1" fill="rgba(255,215,0,0.3)"><animate attributeName="r" values="1;3;1" dur="2s" repeatCount="indefinite"/></circle></svg>') repeat;
            animation: card-sparkle 4s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes card-sparkle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3) rotateY(-30deg);
            }
            50% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1.05) rotateY(0deg);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotateY(0deg);
            }
        }



        .mandala-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            opacity: 0.1;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* ===== GREETING CARD CONTENT ===== */
        .header {
            text-align: center;
            z-index: 10;
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            color: #FFD700;
            text-shadow: 
                3px 3px 6px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(255, 215, 0, 0.6);
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: #FFF;
            font-weight: 400;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            opacity: 0.95;
        }

        .decorative-line {
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
            margin: 0 auto 20px auto;
            border-radius: 2px;
        }

        .content {
            text-align: center;
            z-index: 10;
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message {
            font-size: clamp(1rem, 2vw, 1.3rem);
            color: #FFF;
            font-weight: 300;
            line-height: 1.6;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
            max-width: 600px;
            margin: 0 auto;
            opacity: 0.9;
        }

        .message em {
            color: #FFD700;
            font-style: normal;
            font-weight: 400;
        }

        @keyframes glow {
            from { 
                text-shadow: 
                    3px 3px 6px rgba(0, 0, 0, 0.5), 
                    0 0 20px rgba(255, 215, 0, 0.5); 
            }
            to { 
                text-shadow: 
                    3px 3px 6px rgba(0, 0, 0, 0.5), 
                    0 0 30px rgba(255, 215, 0, 0.8),
                    0 0 40px rgba(255, 215, 0, 0.4); 
            }
        }

        .diyas-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            z-index: 5;
        }

        .side-diyas-left {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 60px;
            z-index: 5;
        }

        .side-diyas-right {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 60px;
            z-index: 5;
        }

        .floating-diyas {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 60%;
            z-index: 3;
            pointer-events: none;
        }

        .floating-diya {
            position: absolute;
            animation: float 4s ease-in-out infinite;
        }

        .floating-diya:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-diya:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 1s;
        }

        .floating-diya:nth-child(3) {
            bottom: 30%;
            left: 20%;
            animation-delay: 2s;
        }

        .floating-diya:nth-child(4) {
            bottom: 15%;
            right: 25%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.4;
            }
            50% {
                transform: translateY(-10px) rotate(2deg);
                opacity: 0.8;
            }
        }

        .diya {
            width: 60px;
            height: 40px;
            position: relative;
        }

        .diya-small {
            width: 40px;
            height: 30px;
            position: relative;
        }

        .diya-large {
            width: 80px;
            height: 50px;
            position: relative;
        }

        .diya-base {
            width: 50px;
            height: 25px;
            background: linear-gradient(45deg, #8B4513, #CD853F);
            border-radius: 0 0 25px 25px;
            position: absolute;
            bottom: 0;
            left: 5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .diya-base-small {
            width: 35px;
            height: 18px;
            background: linear-gradient(45deg, #A0522D, #D2B48C);
            border-radius: 0 0 18px 18px;
            position: absolute;
            bottom: 0;
            left: 2.5px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
        }

        .diya-base-large {
            width: 70px;
            height: 35px;
            background: linear-gradient(45deg, #654321, #B8860B);
            border-radius: 0 0 35px 35px;
            position: absolute;
            bottom: 0;
            left: 5px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
        }

        .diya-flame {
            width: 15px;
            height: 20px;
            background: radial-gradient(ellipse at center, #FFD700 0%, #FF4500 70%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 1.5s ease-in-out infinite alternate;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .diya-flame-small {
            width: 12px;
            height: 16px;
            background: radial-gradient(ellipse at center, #FFA500 0%, #FF6347 70%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 2s ease-in-out infinite alternate;
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.5);
        }

        .diya-flame-large {
            width: 20px;
            height: 28px;
            background: radial-gradient(ellipse at center, #FFFF00 0%, #FF4500 70%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 1.2s ease-in-out infinite alternate;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.7);
        }

        @keyframes flicker {
            0% { 
                transform: translateX(-50%) scale(1); 
                filter: brightness(1);
            }
            25% { 
                transform: translateX(-50%) scale(1.1) rotate(-1deg); 
                filter: brightness(1.2);
            }
            50% { 
                transform: translateX(-50%) scale(0.9) rotate(1deg); 
                filter: brightness(0.9);
            }
            75% { 
                transform: translateX(-50%) scale(1.05) rotate(-0.5deg); 
                filter: brightness(1.1);
            }
            100% { 
                transform: translateX(-50%) scale(0.95) rotate(0.5deg); 
                filter: brightness(1);
            }
        }

        /* NEW SPECTACULAR FIREWORKS SYSTEM */
        .fireworks-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 8;
        }

        /* BRAND NEW FIREWORK TYPES */
        
        /* Chrysanthemum Fireworks */
        .chrysanthemum {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #FFD700, #FF6B35);
            border-radius: 50%;
            animation: chrysanthemum-bloom 4s ease-out infinite;
        }

        .chrysanthemum::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            width: 48px;
            height: 48px;
            border: 2px solid transparent;
            border-radius: 50%;
            animation: chrysanthemum-ring 4s ease-out infinite;
        }

        /* Peony Fireworks */
        .peony {
            position: absolute;
            width: 12px;
            height: 12px;
            background: conic-gradient(from 0deg, #FF69B4, #FFD700, #00CED1, #FF69B4);
            border-radius: 50%;
            animation: peony-burst 3.5s ease-out infinite;
        }

        /* Willow Fireworks */
        .willow {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #32CD32;
            border-radius: 50%;
            animation: willow-droop 5s ease-out infinite;
        }

        .willow::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 3px;
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, #32CD32, transparent);
            animation: willow-trail 5s ease-out infinite;
        }

        /* Palm Fireworks */
        .palm {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #FFA500, #FF4500);
            border-radius: 50%;
            animation: palm-spread 3s ease-out infinite;
        }

        .palm::before,
        .palm::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 25px;
            background: linear-gradient(to bottom, #FFA500, transparent);
        }

        .palm::before {
            top: -25px;
            left: 4px;
            transform: rotate(-30deg);
            animation: palm-branch-left 3s ease-out infinite;
        }

        .palm::after {
            top: -25px;
            left: 4px;
            transform: rotate(30deg);
            animation: palm-branch-right 3s ease-out infinite;
        }

        /* Ring Fireworks */
        .ring {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid #FF1493;
            border-radius: 50%;
            background: transparent;
            animation: ring-expand 2.5s ease-out infinite;
        }

        /* Comet Fireworks */
        .comet {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #00FFFF;
            border-radius: 50%;
            animation: comet-streak 4s linear infinite;
        }

        .comet::before {
            content: '';
            position: absolute;
            top: 0;
            left: 8px;
            width: 30px;
            height: 2px;
            background: linear-gradient(to right, #00FFFF, transparent);
            animation: comet-tail 4s linear infinite;
        }

        /* Crossette Fireworks */
        .crossette {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #FF6347;
            border-radius: 50%;
            animation: crossette-split 3s ease-out infinite;
        }

        .crossette::before,
        .crossette::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 2px;
            background: #FF6347;
            top: 2px;
            left: -7px;
        }

        .crossette::after {
            transform: rotate(90deg);
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 0 0 currentColor;
            }
            30% {
                transform: scale(15);
                opacity: 1;
                box-shadow: 0 0 15px 8px rgba(255, 215, 0, 0.6);
            }
            60% {
                transform: scale(30);
                opacity: 0.8;
                box-shadow: 0 0 25px 15px rgba(255, 215, 0, 0.4);
            }
            100% {
                transform: scale(45);
                opacity: 0;
                box-shadow: 0 0 40px 25px rgba(255, 215, 0, 0.1);
            }
        }

        @keyframes rocket-launch {
            0% {
                transform: translateY(100px);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                transform: translateY(-80px);
                opacity: 1;
            }
            90% {
                transform: translateY(-90px) scale(2);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) scale(0);
                opacity: 0;
            }
        }

        @keyframes star-twinkle {
            0%, 100% {
                transform: scale(1) rotate(0deg);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.5) rotate(180deg);
                opacity: 1;
            }
        }

        @keyframes fountain-spray {
            0% {
                transform: translateY(0) scaleY(1);
                opacity: 1;
            }
            50% {
                transform: translateY(-20px) scaleY(1.5);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-40px) scaleY(0.5);
                opacity: 0;
            }
        }

        @keyframes spiral-motion {
            0% {
                transform: rotate(0deg) translateX(20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: rotate(360deg) translateX(20px) rotate(-360deg);
                opacity: 0.3;
            }
        }

        /* Continuous Background Fireworks */
        .continuous-fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .bg-firework {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            animation: bg-explode 4s ease-out infinite;
        }

        .bg-firework:nth-child(1) {
            top: 20%;
            left: 15%;
            background: #FFD700;
            animation-delay: 0s;
        }

        .bg-firework:nth-child(2) {
            top: 30%;
            right: 20%;
            background: #FF6B35;
            animation-delay: 1s;
        }

        .bg-firework:nth-child(3) {
            bottom: 35%;
            left: 25%;
            background: #F7931E;
            animation-delay: 2s;
        }

        .bg-firework:nth-child(4) {
            top: 40%;
            right: 10%;
            background: #DC143C;
            animation-delay: 3s;
        }

        .bg-firework:nth-child(5) {
            bottom: 20%;
            right: 30%;
            background: #4169E1;
            animation-delay: 0.5s;
        }

        .bg-firework:nth-child(6) {
            top: 60%;
            left: 40%;
            background: #32CD32;
            animation-delay: 1.5s;
        }

        @keyframes bg-explode {
            0% {
                transform: scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            50% {
                transform: scale(15);
                opacity: 0.7;
            }
            100% {
                transform: scale(25);
                opacity: 0;
            }
        }

        @keyframes burst {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            30% {
                transform: scale(15);
                opacity: 0.8;
            }
            100% {
                transform: scale(30);
                opacity: 0;
            }
        }

        @keyframes trail {
            0% {
                transform: translateY(50px) scale(1);
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(0.5);
                opacity: 0;
            }
        }

        .rangoli-pattern {
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            opacity: 0.2;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .corner-decoration {
            position: absolute;
            width: 80px;
            height: 80px;
            opacity: 0.3;
        }

        .top-left {
            top: 20px;
            left: 20px;
            transform: rotate(0deg);
        }

        .top-right {
            top: 20px;
            right: 20px;
            transform: rotate(90deg);
        }

        .bottom-left {
            bottom: 20px;
            left: 20px;
            transform: rotate(-90deg);
        }

        .bottom-right {
            bottom: 20px;
            right: 20px;
            transform: rotate(180deg);

    <script>
        function lightFirecracker() {
            console.log('🧨 Firecracker clicked!');
            
            try {
                const fuseSpark = document.getElementById('fuseSpark');
                const launchScreen = document.getElementById('launchScreen');
                const explosionScreen = document.getElementById('explosionScreen');
                const greetingCard = document.getElementById('greetingCard');
                
                // Check if all elements exist
                if (!fuseSpark || !launchScreen || !explosionScreen || !greetingCard) {
                    console.error('❌ Missing elements:', {fuseSpark, launchScreen, explosionScreen, greetingCard});
                    return;
                }
                
                console.log('✅ All elements found - greeting card is already loaded behind!');
                
                // Disable further clicks
                launchScreen.style.pointerEvents = 'none';
                
                // Start the fuse burning animation
                fuseSpark.classList.add('active');
                console.log('🔥 Fuse lit - burning for 3 seconds...');
                
                // After 3 seconds (fuse burn time), show explosion
                setTimeout(() => {
                    console.log('💥 Fuse burned out - showing explosion...');
                    
                    // Hide launch screen with fade effect
                    launchScreen.style.opacity = '0';
                    launchScreen.style.transform = 'scale(0.8)';
                    
                    // Show explosion screen
                    explosionScreen.style.display = 'block';
                    explosionScreen.style.visibility = 'visible';
                    explosionScreen.style.opacity = '1';
                    explosionScreen.classList.add('active');
                    
                    console.log('💥 Explosion covering the screen...');
                    
                    // After explosion (2 seconds), reveal greeting card
                    setTimeout(() => {
                        console.log('🎆 Explosion finished - revealing greeting card behind...');
                        
                        // Hide explosion with fade effect
                        explosionScreen.style.opacity = '0';
                        
                        // After explosion fades, hide it completely and reveal greeting card
                        setTimeout(() => {
                            explosionScreen.classList.remove('active');
                            explosionScreen.style.display = 'none';
                            explosionScreen.style.visibility = 'hidden';
                            
                            // Hide launch screen completely
                            launchScreen.style.display = 'none';
                            launchScreen.style.visibility = 'hidden';
                            
                            // Reveal greeting card (it was already loaded behind)
                            greetingCard.classList.add('show');
                            
                            console.log('🎉 Greeting card revealed successfully!');
                            
                            // Reset cursor
                            document.body.style.cursor = 'default';
                            
                        }, 500); // Wait for explosion fade
                        
                    }, 2000);
                    
                }, 3000);
                
            } catch (error) {
                console.error('❌ Error in lightFirecracker:', error);
            }
        }
        
        // Removed test helper function to keep production behavior clean
        
        // Test after page loads
        window.addEventListener('load', function() {
            console.log('🚀 Page loaded - elements check:');
            const launchScreen = document.getElementById('launchScreen');
            const explosionScreen = document.getElementById('explosionScreen');
            const greetingCard = document.getElementById('greetingCard');
            
            console.log('Launch screen:', launchScreen ? '✅ Found' : '❌ Missing');
            console.log('Explosion screen:', explosionScreen ? '✅ Found' : '❌ Missing');
            console.log('Greeting card:', greetingCard ? '✅ Found' : '❌ Missing');
            
            if (greetingCard) {
                console.log('Greeting card computed styles:', {
                    display: window.getComputedStyle(greetingCard).display,
                    opacity: window.getComputedStyle(greetingCard).opacity,
                    visibility: window.getComputedStyle(greetingCard).visibility,
                    transform: window.getComputedStyle(greetingCard).transform,
                    zIndex: window.getComputedStyle(greetingCard).zIndex
                });
            }
            
            // Note: automatic auto-show behavior removed to require user interaction
        });
        
        // Optional: Add keyboard interaction
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space' || event.code === 'Enter') {
                if (!document.getElementById('launchScreen').classList.contains('hidden')) {
                    lightFirecracker();
                }
            }
        });
        
        // Add some sparkle effects to the explosion
        function createSparkles() {
            const explosion = document.getElementById('explosionScreen');
            for (let i = 0; i < 50; i++) {
                const sparkle = document.createElement('div');
                sparkle.style.position = 'absolute';
                sparkle.style.width = Math.random() * 4 + 2 + 'px';
                sparkle.style.height = sparkle.style.width;
                sparkle.style.background = ['#FFD700', '#FF4500', '#FFA500', '#FFFF00'][Math.floor(Math.random() * 4)];
                sparkle.style.borderRadius = '50%';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animation = `sparkle-explosion ${Math.random() * 2 + 1}s ease-out forwards`;
                explosion.appendChild(sparkle);
                
                // Remove sparkle after animation
                setTimeout(() => {
                    if (sparkle.parentNode) {
                        sparkle.parentNode.removeChild(sparkle);
                    }
                }, 3000);
            }
        }
        
        // Add CSS for sparkle animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes sparkle-explosion {
                0% {
                    transform: scale(0) rotate(0deg);
                    opacity: 1;
                }
                50% {
                    transform: scale(1.5) rotate(180deg);
                    opacity: 0.8;
                }
                100% {
                    transform: scale(0) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
        
        // Trigger sparkles during explosion
        document.getElementById('explosionScreen').addEventListener('animationstart', function() {
            createSparkles();
        });
    </script>
